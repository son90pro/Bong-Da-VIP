name: Auto Generate M3U Playlist

on:
  schedule:
    # Chạy tự động mỗi 2 giờ một lần
    - cron: '0 */2 * * *'
  workflow_dispatch: # Cho phép chạy thủ công trên giao diện GitHub

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

      - name: Run M3U Generator script
        run: |
          python generate_m3u.py

      - name: Commit and push if playlist changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add playlist.m3u
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update M3U playlist [skip ci]" && git push)
          
